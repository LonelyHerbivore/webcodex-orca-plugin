name: Orca native plugin tests
on:
  push:
    branches:
      - "feat/active-turn-worker-wait-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify syntax
        run: |
          node --check src/worker_wait.mjs
          node --check src/tools.mjs
      - name: Run entire plugin regression suite
        run: npm test
